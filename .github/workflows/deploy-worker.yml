name: Deploy Worker (API)

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

env:
  CF_ACCOUNT: 0e58fe4a2ba9eabd4aa4e029b8b5ed85
  CF_D1_DB: 0c202650-a68f-4e3e-9680-e0043af70f9d

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify token (user + account endpoints; never prints the token)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "SECRET IS EMPTY"; exit 1; fi
          echo "token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "--- as USER token ---"
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('valid:', d.get('success'), '| status:', (d.get('result') or {}).get('status'), '| errors:', d.get('errors'))"
          echo "--- as ACCOUNT token ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('valid:', d.get('success'), '| status:', (d.get('result') or {}).get('status'), '| errors:', d.get('errors'))"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations (wrangler)
        id: wrangler_migrate
        continue-on-error: true
        run: npx wrangler d1 migrations apply cast-app --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0e58fe4a2ba9eabd4aa4e029b8b5ed85

      - name: Apply D1 migrations (REST fallback)
        if: steps.wrangler_migrate.outcome == 'failure'
        run: |
          python3 - <<'PYEOF'
          import json, os, glob, urllib.request

          token = os.environ['CLOUDFLARE_API_TOKEN']
          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT']}/d1/database/{os.environ['CF_D1_DB']}/query"

          def run_sql(sql):
              req = urllib.request.Request(url, method='POST',
                  data=json.dumps({'sql': sql}).encode(),
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req) as r:
                      d = json.load(r)
              except urllib.error.HTTPError as e:
                  d = json.load(e)
              return d.get('success'), d.get('errors')

          failed = False
          for path in sorted(glob.glob('migrations/*.sql')):
              raw = open(path).read()
              # strip line comments, then split statements
              lines = [l for l in raw.splitlines() if not l.strip().startswith('--')]
              for stmt in '\n'.join(lines).split(';'):
                  stmt = stmt.strip()
                  if not stmt:
                      continue
                  ok, errs = run_sql(stmt + ';')
                  label = stmt.split('(')[0].replace('\n', ' ')[:70]
                  print(('OK  ' if ok else 'FAIL') + ' | ' + path + ' | ' + label + ('' if ok else f' | errors: {errs}'))
                  if not ok:
                      failed = True
          raise SystemExit(1 if failed else 0)
          PYEOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0e58fe4a2ba9eabd4aa4e029b8b5ed85

      - name: Health check (new /sessions API must exist)
        run: |
          sleep 5
          AUTH_CODE=$(curl -o /dev/null -s -w '%{http_code}' https://cast-ai.theojandhyala.workers.dev/auth/me)
          SESS_CODE=$(curl -o /dev/null -s -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://cast-ai.theojandhyala.workers.dev/sessions)
          echo "GET /auth/me -> $AUTH_CODE (expect 401)"
          echo "POST /sessions -> $SESS_CODE (expect 401; 404/405 means old worker still live)"
          [ "$SESS_CODE" = "401" ] || { echo "FAIL: live-sessions API not live"; exit 1; }
          echo "live-sessions API is LIVE"
